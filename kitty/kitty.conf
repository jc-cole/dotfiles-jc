# Everyday terminal: readable, compact, with a glimpse of the wallpaper.
shell /usr/bin/fish
font_size 13.0

background #08080b
wayland_titlebar_color #000000
foreground #e9eee9
background_opacity 0.92
dynamic_background_opacity yes

# A little breathing room without wasting screen space.
window_padding_width 4
scrollback_lines 10000

# Quiet accents that complement the fish prompt.
selection_foreground #e9eee9
selection_background #403052
url_color #36c9dc
active_border_color #9b87ff
inactive_border_color #34343c

# Stable cursor for reading and editing; no blinking distraction.
cursor_blink_interval 0

# Opacity controls: Ctrl+Shift+A, then 1 (opaque) or D (restore 92%).
map kitty_mod+a>1 set_background_opacity 1
map kitty_mod+a>d set_background_opacity default
